<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Domine:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <title>Battle Tracker - Klątwa Strahda</title>
</head>
<body>
    <div class="app" id="app">
        <header class="app-header">
            <h1>Battle Tracker - Klątwa Strahda</h1>
            <div class="header-status">
                <span class="save-indicator" id="saveIndicator" title="Stan zapisu">●</span>
            </div>
        </header>

        <nav class="tabs" id="navTabs">
            <button type="button" class="tab-btn" data-route="/battles">Walki</button>
            <button type="button" class="tab-btn" data-route="/participants">Uczestnicy</button>
        </nav>

        <main id="view">
            <p class="placeholder">Ładowanie...</p>
        </main>

        <footer class="app-footer">
            <span id="bootStatus">Inicjalizacja...</span>
        </footer>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
