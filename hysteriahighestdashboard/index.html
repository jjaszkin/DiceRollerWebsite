<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../shared/handouts/handouts.css">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <title>Hysteria Highest — Dashboard</title>
</head>
<body>

    <!-- ═══ Gate startowy ═══ -->
    <div id="characterGate" class="gate active">
        <div class="gate-box">
            <img src="images/logo.png" alt="Hysteria Highest" class="gate-logo" onerror="this.style.display='none'">

            <div id="gateStepRole" class="gate-step">
                <h1 class="gate-title">Hysteria Highest</h1>
                <p class="gate-subtitle">Kto patrzy?</p>
                <div class="gate-role-buttons">
                    <button id="gateRoleMg" class="btn-gate">Jestem Mistrzem Gry</button>
                    <button id="gateRolePlayer" class="btn-gate">Jestem Graczem</button>
                </div>
            </div>

            <div id="gateStepPin" class="gate-step" style="display:none;">
                <h2 class="gate-title">PIN Mistrza Gry</h2>
                <div id="gatePinInputs" class="pin-digits">
                    <input type="text" inputmode="numeric" maxlength="1" class="pin-digit">
                    <input type="text" inputmode="numeric" maxlength="1" class="pin-digit">
                    <input type="text" inputmode="numeric" maxlength="1" class="pin-digit">
                    <input type="text" inputmode="numeric" maxlength="1" class="pin-digit">
                </div>
                <p id="gatePinError" class="gate-error" style="display:none;"></p>
                <div class="gate-nav-buttons">
                    <button id="gatePinBack" class="btn-gate-secondary">Wstecz</button>
                    <button id="gatePinNext" class="btn-gate" disabled>Dalej</button>
                </div>
            </div>

            <div id="gateStepPair" class="gate-step" style="display:none;">
                <h2 class="gate-title">Wybierz swój duet</h2>
                <div id="gatePairList" class="gate-pair-list"></div>
                <p id="gatePairError" class="gate-error" style="display:none;"></p>
                <div class="gate-nav-buttons">
                    <button id="gatePairBack" class="btn-gate-secondary">Wstecz</button>
                </div>
            </div>

            <button id="gateCancel" class="btn-gate-secondary gate-cancel" style="display:none;">Anuluj</button>
        </div>
    </div>

    <!-- ═══ Aplikacja ═══ -->
    <div id="app" class="hidden">
        <header class="app-header">
            <img src="images/logo.png" alt="Hysteria Highest" class="header-logo" onerror="this.style.display='none'">
            <h1 class="app-title">Hysteria Highest</h1>
            <div class="header-actions">
                <span id="saveIndicator" class="save-indicator" title="Status zapisu"></span>
                <button id="changeCharacterBtn" class="btn-header">Zmień rolę</button>
            </div>
        </header>

        <nav id="mainTabs" class="main-tabs">
            <button class="tab-btn active" data-tab="tarot">Tarot</button>
            <button class="tab-btn" data-tab="divinity">Tor Boskości</button>
            <button class="tab-btn" data-tab="charA">Postać 1</button>
            <button class="tab-btn" data-tab="charB">Postać 2</button>
            <button class="tab-btn" data-tab="handouts">Handouty</button>
        </nav>

        <main class="tab-panels">
            <section id="panel-tarot" class="tab-panel active"></section>
            <section id="panel-divinity" class="tab-panel"></section>
            <section id="panel-charA" class="tab-panel"></section>
            <section id="panel-charB" class="tab-panel"></section>
            <section id="panel-handouts" class="tab-panel"></section>
        </main>

        <div id="mgUnifiedRoot" class="mg-unified-root hidden"></div>

        <footer class="app-footer">
            <span id="bootStatus">Wczytywanie...</span>
        </footer>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
