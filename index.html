<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <title>Mini-serwisy</title>
</head>
<body>

    <div id="lockScreen" class="lock-screen">
        <form id="pinForm" class="pin-form">
            <h1>Mini-serwisy</h1>
            <label for="pinInput">PIN</label>
            <input type="password" id="pinInput" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="****">
            <button type="submit" id="pinSubmit">Odblokuj</button>
            <p id="pinError" class="pin-error"></p>
        </form>
    </div>

    <div id="dashboard" class="dashboard hidden">
        <header class="dashboard-header">
            <h1>Mini-serwisy</h1>
            <button id="changePinToggle" class="ghost-button">Zmień PIN</button>
        </header>

        <form id="changePinForm" class="change-pin-form hidden">
            <input type="password" id="newPin" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Nowy PIN">
            <input type="password" id="confirmPin" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Powtórz nowy PIN">
            <button type="submit">Zapisz</button>
            <p id="changePinMessage" class="change-pin-message"></p>
        </form>

        <p id="listStatus" class="list-status">Ładowanie listy...</p>
        <div id="cardGrid" class="card-grid"></div>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
