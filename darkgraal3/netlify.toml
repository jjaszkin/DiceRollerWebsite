[build]
  publish = ".."
  ignore  = "exit 0"

[[redirects]]
  from = "/gmpanel"
  to   = "/darkgraal3/gmpanel.html"
  status = 301

[[redirects]]
  from = "/klatwastrahda/gmpanel"
  to   = "/klatwastrahda/gmpanel.html"
  status = 200

# /hhighest/* → /hysteriahighest/* — 200 rewrite (URL w przeglądarce zostaje /hhighest)
[[redirects]]
  from = "/hhighest"
  to   = "/hysteriahighest/index.html"
  status = 200

[[redirects]]
  from = "/hhighest/gmpanel"
  to   = "/hysteriahighest/gmpanel.html"
  status = 200

[[redirects]]
  from = "/hhighest/*"
  to   = "/hysteriahighest/:splat"
  status = 200
